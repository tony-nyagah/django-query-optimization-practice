services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: django_query_optimization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        until pg_isready -h db -p 5432 -U postgres 2>/dev/null; do
          sleep 1
        done &&
        echo 'Running migrations...' &&
        uv run manage.py migrate &&
        echo 'Starting server...' &&
        uv run -- gunicorn core.wsgi:application --bind 0.0.0.0:1759 --workers 2 --timeout 120
      "
    volumes:
      - .:/app
      - /app/.venv
    ports:
      - "1759:1759"
    environment:
      POSTGRES_DB: django_query_optimization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      UV_PROJECT_ENVIRONMENT: /venv
      ALLOWED_HOSTS: "localhost,127.0.0.1,.nyagah.me"
      DEBUG: "False"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
