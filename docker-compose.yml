services:
  web:
    build: .
    command: >
      sh -c "uv run manage.py migrate --noinput &&
             uv run -- gunicorn core.wsgi:application --bind 0.0.0.0:1759 --workers 2 --timeout 120"
    volumes:
      - .:/app
      - /app/.venv
      - sqlite_data:/app/data
    ports:
      - "1759:1759"
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      ALLOWED_HOSTS: "localhost,127.0.0.1,.nyagah.me"

volumes:
  sqlite_data:
